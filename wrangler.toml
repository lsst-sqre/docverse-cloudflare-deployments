name = "docverse"
main = "worker/src/index.ts"
compatibility_date = "2026-04-09"
compatibility_flags = ["nodejs_compat"]

# No top-level bindings — testing happens in the docverse source repo.
# All bindings are defined per-environment below.

# ============================================================================
# jsc-test-20260409 organization on roundtable-dev
# Deployed worker: docverse-dev-jsc-test-20260409
# Access: docverse-dev-jsc-test-20260409.<account>.workers.dev
# ============================================================================
[env.dev-jsc-test-20260409.vars]
URL_SCHEME = "path-prefix"

[[env.dev-jsc-test-20260409.kv_namespaces]]
binding = "EDITIONS_KV"
id = "35e1117666814823a27689d1f3afa8fe"

[[env.dev-jsc-test-20260409.r2_buckets]]
binding = "BUILDS_R2"
bucket_name = "docverse-dev-jsc-test-20260409-builds"

# ============================================================================
# jsc-test-20260807 organization on roundtable-dev
# Deployed worker: docverse-dev-jsc-test-20260807
# Subdomain URL scheme: each project served at {project}.jsc-docverse.ca
# Requires a proxied wildcard DNS record (* A 192.0.2.1) in the zone.
# ============================================================================
[env.dev-jsc-test-20260807]
workers_dev = false
routes = [
  { pattern = "*.jsc-docverse.ca/*", zone_name = "jsc-docverse.ca" }
]

[env.dev-jsc-test-20260807.vars]
URL_SCHEME = "subdomain"

[[env.dev-jsc-test-20260807.kv_namespaces]]
binding = "EDITIONS_KV"
id = "26c98005cffc42768890793dde4db42b"

[[env.dev-jsc-test-20260807.r2_buckets]]
binding = "BUILDS_R2"
bucket_name = "docverse-dev-jsc-test-20260807-builds"

# ============================================================================
# rubin organization on roundtable (production)
# Deployed worker: docverse-production-rubin
# Cloudflare account: Rubin SQuaRE (distinct from the roundtable-dev account)
# Subdomain URL scheme: each project served at {project}.docverse-testing.dev
# during the LTD sync period; an *.lsst.io route is added at cutover.
# Requires a proxied wildcard DNS record (* A 192.0.2.1) in the zone.
#
# The account also holds docverse-production-rubin-staging, intended as the
# Docverse server's upload staging store. It is unused for now: the rubin org
# stages and publishes through the builds bucket until the server supports
# split stores (lsst-sqre/docverse#663). The worker only ever reads the
# builds bucket, so the staging bucket has no binding here.
# ============================================================================
[env.production-rubin]
account_id = "4268a931520ee81c56e48984b40069ca"
workers_dev = false
routes = [
  { pattern = "*.docverse-testing.dev/*", zone_name = "docverse-testing.dev" }
]

[env.production-rubin.vars]
URL_SCHEME = "subdomain"

[[env.production-rubin.kv_namespaces]]
binding = "EDITIONS_KV"
id = "d53a03631965443cafbb5114c4693d24"

[[env.production-rubin.r2_buckets]]
binding = "BUILDS_R2"
bucket_name = "docverse-production-rubin-builds"
